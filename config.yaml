# Universo de Morningstar. FOESP$$ALL = fondos España.
universe: "FOESP$$ALL"
language: "es-ES"
currency: "EUR"

# GT:0 = solo fondos con alguna estrella. Excluye los no valorados.
filters: "StarRatingM255:GT:0"

data_points:
  - SecId
  - ISIN
  - LegalName
  - CategoryName
  - StarRatingM255
  - MorningstarRiskM255
  - PriceCurrency

page_size: 500
sleep_between_pages: [2, 5]
max_pages: 120

output: "data/ratings.json"

# Tras deduplicar por ISIN el volumen baja: margen amplio sobre lo real.
min_total: 15000
max_total: 45000
min_rated_ratio: 0.95
max_golden_changes: 2
